<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEAZER CRACK</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ...BURAYA SENİN GÖNDERDİĞİN UZUN CSS KOYULACAK... */
  </style>
</head>
<body>

  <div class="snow-container"></div>

  <div class="neon-container">
    <div class="logo-container">
      <img src="https://via.placeholder.com/140" alt="Logo" class="logo-image">
    </div>
    <div class="title">TEAZER CRACK</div>

    <div class="input-group">
      <label class="input-label" for="key">Enter your license key</label>
      <div class="input-container">
        <input type="password" id="key" class="key-input" placeholder="Enter key...">
        <i class="fas fa-eye toggle-password" onclick="togglePassword()"></i>
        <button class="paste-btn" onclick="pasteKey()"><i class="fas fa-paste"></i></button>
      </div>
    </div>

    <button class="unlock-btn" onclick="checkKey()"><i class="fas fa-lock-open"></i> Unlock</button>

    <div class="contact-link">
      Need help? <a href="https://t.me/teazerddos_bot" target="_blank">Contact Support</a>
    </div>

    <div class="download-section" id="download-section">
      <div class="version-title">Available Versions</div>
      <div class="version-grid">
        <div class="version-card" onclick="alert('Downloading...')">v1.0 - Basic</div>
        <div class="version-card" onclick="alert('Downloading...')">v2.0 - Advanced</div>
      </div>
    </div>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('key');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function pasteKey() {
      navigator.clipboard.readText().then(text => {
        document.getElementById('key').value = text;
      });
    }

    function checkKey() {
      const key = document.getElementById('key').value;
      if (key === "teazer123") { // Buraya gerçek key kontrolü gelecek
        document.getElementById('download-section').style.display = 'block';
        alert("Key doğru! İndirme açıldı.");
      } else {
        alert("Geçersiz key!");
      }
    }
  </script>
</body>
</html>
