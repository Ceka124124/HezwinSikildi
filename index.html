<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>HEZWINCheat Downloader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <style>
   @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap");
   body {
     font-family: "Inter", sans-serif;
   }
  </style>
 </head>
 <body class="bg-black text-white min-h-screen flex flex-col">
  <header class="bg-[#1a1a1a] px-4 py-3 text-white text-lg font-semibold">
   HEZWINCheat ~ Downloader
  </header>
  <main class="flex-grow flex justify-center items-center p-4">
   <div class="w-full max-w-md rounded-2xl border border-[#0ea5e9] p-6 bg-gradient-to-br from-[#0a1a3a] to-[#0a1a3a]/80 relative overflow-hidden" style="box-shadow: 0 0 20px #0ea5e9;">
    <div aria-hidden="true" class="pointer-events-none absolute inset-0 rounded-2xl" style="background: radial-gradient(circle, #0ea5e9 2px, transparent 3px) repeat; background-size: 30px 30px; opacity: 0.15;"></div>
    <div class="flex justify-center mb-6 relative z-10">
     <img alt="Circular logo with blue neon glow and text HEZWIN CHAT in the center" class="w-28 h-28 rounded-full border-4 border-[#0ea5e9] shadow-[0_0_20px_#0ea5e9]" src="https://storage.googleapis.com/a1aa/image/0db954ca-0f6b-4c96-af96-645210f86e6e.jpg"/>
    </div>
    <h1 class="text-[#0ea5e9] text-3xl font-extrabold text-center mb-6 leading-tight">
     HEZWINCheat<br/>Downloader
    </h1>
    <label class="block text-white text-lg font-normal mb-2 relative z-10" for="license">
     Enter License Key
    </label>
    <div class="relative rounded-xl border-2 border-[#0ea5e9] flex items-center px-4 py-3 mb-6">
     <input class="bg-transparent flex-grow text-gray-400 placeholder-gray-600 text-lg font-semibold focus:outline-none" id="license" placeholder="XXXX-XXXX-XXXX-XXXX" type="text"/>
     <button aria-label="Toggle license key visibility" class="text-[#0ea5e9] ml-3 text-xl focus:outline-none" type="button">
      <i class="fas fa-eye"></i>
     </button>
     <button aria-label="Copy license key" class="ml-3 bg-[#0ea5e9] rounded-full p-2 text-white focus:outline-none" type="button" onclick="copyKey()">
      <i class="fas fa-copy"></i>
     </button>
    </div>
    <button class="w-full bg-gradient-to-r from-[#0ea5e9] to-[#3b82f6] rounded-xl py-4 text-white font-bold text-lg flex justify-center items-center gap-3 hover:brightness-110 transition" type="button" onclick="kontrolEt()">
     <i class="fas fa-unlock-alt"></i>LOGIN
    </button>
    <p class="mt-6 text-center text-gray-400 text-base relative z-10">
     Don't have a key? Contact <a class="text-[#0ea5e9] font-semibold" href="#">@Hezwin</a>
    </p>
   </div>
  </main>

  <script>
    function kontrolEt() {
      var key = document.getElementById("license").value.trim();
      var dogruKeyler = [
        "1234-5678-ABCD-EFGH",
        "1111-2222-3333-4444"
      ];

      if (dogruKeyler.includes(key)) {
        alert("Giriş başarılı! Key doğru.");
        // İsteğe bağlı yönlendirme:
        // window.location.href = "panel.html";
      } else {
        alert("Geçersiz key. Lütfen tekrar deneyin.");
      }
    }

    function copyKey() {
      var input = document.getElementById("license");
      input.select();
      input.setSelectionRange(0, 99999); // mobil uyum
      document.execCommand("copy");
      alert("Key kopyalandı!");
    }
  </script>
 </body>
</html>
